<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FedTech Search</title>
  <meta name="description" content="Search federal tech jobs by role, tech stack, seniority, clearance and work arrangement.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="theme-color" content="#0a3161">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap">
  <script>
    // Pick the theme before first paint: saved choice, else the system setting.
    (function () {
      var t;
      try { t = localStorage.getItem('fedtech-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
